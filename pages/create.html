<!DOCTYPE html>
<html>
<head>
    <title>Giggle - Create</title>
    <link rel="stylesheet" href="../style.css">
</head>
<body>
    <div class="container">
        <h1 id="form-title">Create</h1>

        <form class="form" id="post-form">
            <input
                id="title"
                type="text"
                placeholder="Title"
            >

            <textarea
                id="description"
                placeholder="Write your post..."
            ></textarea>

            <div class="button-group">
                <button type="submit" id="submit-button">
                    Create
                </button>

                <a href="../index.html" class="link-button">
                    Cancel
                </a>
            </div>
        </form>
    </div>

    <script src="../scripts/script.js"></script>
</body>
</html>
